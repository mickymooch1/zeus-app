# Tests and production builds for every push and pull request.
#
# Railway deploys production straight from master and its Docker build only
# compiles the frontends — it runs no tests. This workflow is the test gate.
# Versions match the Dockerfile: Node 20 for both frontends, Python 3.12.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-beats:
    name: zeusbeats.com frontend — tests + production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-beats
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-beats/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Google tag is not in the static HTML
        run: |
          if grep -q googletagmanager ../web-beats-dist/index.html; then
            echo "::error::index.html must not load Google's tag (it only runs in /ads-frame.html after consent)"
            exit 1
          fi
          test -f ../web-beats-dist/ads-frame.html
          test -f ../web-beats-dist/ads-frame.js

  web:
    name: zeusaidesign.com frontend — production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: backend — pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      # Dummy values only: the suite mocks every external service. Don't set
      # SONG_PUBLIC_BASE_URL / SONG_WEBHOOK_URL — the tests set their own.
      ANTHROPIC_API_KEY: x
      APIFRAME_API_KEY: x
      JWT_SECRET: x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # Scratch dirs for songs and the SQLite DB (the runner context isn't
      # available in a job-level env block, so they are set here).
      - name: Scratch data dirs
        run: |
          echo "SONG_STORAGE_PATH=$RUNNER_TEMP/songs" >> "$GITHUB_ENV"
          echo "ZEUS_DATA_DIR=$RUNNER_TEMP/zeus-data" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/songs" "$RUNNER_TEMP/zeus-data"
      # `tests`, not bare pytest: backend/test_song_pipeline.py is a live-API script.
      # On failure the tail of the output is also posted as one error annotation,
      # so it is readable on the run page without opening the raw log.
      - name: pytest
        shell: bash
        run: |
          set +e
          python -m pytest tests -q -rfE -p no:cacheprovider 2>&1 | tee "$RUNNER_TEMP/pytest.log"
          code=${PIPESTATUS[0]}
          if [ "$code" != 0 ]; then
            msg=$(tail -n 60 "$RUNNER_TEMP/pytest.log" | sed -e 's/%/%25/g' -e 's//%0D/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=pytest exit $code::${msg}"
          fi
          exit $code
