# Tests and production builds for every push and pull request.
#
# Railway deploys production straight from master and its Docker build only
# compiles the frontends — it runs no tests. This workflow is the test gate.
# Versions match the Dockerfile: Node 20 for both frontends, Python 3.12.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-beats:
    name: zeusbeats.com frontend — tests + production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-beats
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-beats/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Google tag is not in the static HTML
        run: |
          if grep -q googletagmanager ../web-beats-dist/index.html; then
            echo "::error::index.html must not load Google's tag (it only runs in /ads-frame.html after consent)"
            exit 1
          fi
          test -f ../web-beats-dist/ads-frame.html
          test -f ../web-beats-dist/ads-frame.js

  web:
    name: zeusaidesign.com frontend — production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: backend — pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      # Dummy values only: the suite mocks every external service. Don't set
      # SONG_PUBLIC_BASE_URL / SONG_WEBHOOK_URL — the tests set their own.
      ANTHROPIC_API_KEY: x
      APIFRAME_API_KEY: x
      JWT_SECRET: x
      SONG_STORAGE_PATH: ${{ runner.temp }}/songs
      ZEUS_DATA_DIR: ${{ runner.temp }}/zeus-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: mkdir -p "$SONG_STORAGE_PATH" "$ZEUS_DATA_DIR"
      # `tests`, not bare pytest: backend/test_song_pipeline.py is a live-API script.
      - run: python -m pytest tests -q
